<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Milliplex 试剂盒智能推荐</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   MERCK BRAND IDENTITY — 12 色系 + 字体规范
   Rich:     #5c2d91 #e4007c #7db928 #f5a800
   Vibrant:  #1a5ea8 #00b0ca #e2001a #009b55
   Sensitive:#7b5ea7 #e87fb4 #c8d400 #f0b400
   ============================================================ */
:root{
  --rich-purple:#5c2d91;
  --rich-pink:#e4007c;
  --rich-green:#7db928;
  --rich-yellow:#f5a800;
  --vibrant-blue:#1a5ea8;
  --vibrant-teal:#00b0ca;
  --vibrant-red:#e2001a;
  --vibrant-emerald:#009b55;
  --sensitive-purple:#7b5ea7;
  --sensitive-pink:#e87fb4;
  --sensitive-lime:#c8d400;
  --sensitive-amber:#f0b400;
  --bg:#ffffff;
  --surface:#f8f9fc;
  --border:#e2e6ef;
  --text:#1a1a2e;
  --muted:#6b7280;
  --primary:var(--vibrant-blue);
  --accent:var(--rich-purple);
  --radius:12px;
  --shadow:0 2px 16px rgba(26,94,168,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC',Verdana,Arial,sans-serif;
  font-size:15px;color:var(--text);background:var(--bg);
  min-height:100vh;padding-bottom:64px;
}

/* ─── HEADER ─────────────────────────────────────────── */
.header{
  background:linear-gradient(135deg,var(--rich-purple) 0%,var(--vibrant-blue) 100%);
  color:#fff;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  min-height:64px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 12px rgba(92,45,145,0.25);
}
.header-logo{height:38px;width:auto;filter:brightness(0) invert(1);}
.header-title{
  font-size:16px;font-weight:700;letter-spacing:.5px;
  opacity:.92;text-align:right;line-height:1.3;
}
.header-title span{display:block;font-size:12px;font-weight:400;opacity:.75;}

/* ─── BREADCRUMB ──────────────────────────────────────── */
.breadcrumb{
  display:flex;align-items:center;gap:6px;
  padding:10px 24px;background:var(--surface);
  border-bottom:1px solid var(--border);
  font-size:13px;color:var(--muted);flex-wrap:wrap;
}
.breadcrumb-item{cursor:pointer;color:var(--primary);}
.breadcrumb-item:hover{text-decoration:underline;}
.breadcrumb-sep{color:var(--border);}
.breadcrumb-current{color:var(--muted);font-weight:500;}

/* ─── MAIN CONTAINER ──────────────────────────────────── */
.container{max-width:960px;margin:0 auto;padding:28px 20px 20px;}

/* ─── SECTION PAGES ───────────────────────────────────── */
.page{display:none;animation:fadeIn .25s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.page-title{
  font-size:22px;font-weight:700;color:var(--accent);
  margin-bottom:6px;
}
.page-hint{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6;}

/* ─── SPECIES GRID ────────────────────────────────────── */
.species-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:12px;margin-top:4px;
}
.species-card{
  border:2px solid var(--border);border-radius:var(--radius);
  padding:16px 12px;text-align:center;cursor:pointer;
  background:#fff;transition:all .18s ease;
  font-size:15px;font-weight:500;color:var(--text);
  position:relative;overflow:hidden;
}
.species-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--rich-purple),var(--vibrant-teal));
  opacity:0;transition:opacity .18s ease;
}
.species-card:hover::before{opacity:.07;}
.species-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow);}
.species-card .icon{font-size:26px;display:block;margin-bottom:6px;}
.species-card .label{position:relative;z-index:1;}

/* ─── TYPE SELECTOR ───────────────────────────────────── */
.type-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
  max-width:500px;margin:0 auto;
}
.type-card{
  border:2px solid var(--border);border-radius:var(--radius);
  padding:28px 20px;text-align:center;cursor:pointer;
  background:#fff;transition:all .18s ease;
}
.type-card:hover{border-color:var(--vibrant-teal);box-shadow:var(--shadow);transform:translateY(-2px);}
.type-card .type-icon{font-size:36px;display:block;margin-bottom:10px;}
.type-card .type-name{font-size:17px;font-weight:700;color:var(--accent);}
.type-card .type-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}

/* ─── FACTOR INPUT ────────────────────────────────────── */
.input-section{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:20px;
}
.input-label{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--accent);display:flex;align-items:center;gap:6px;}
.input-label .badge{
  background:var(--vibrant-teal);color:#fff;
  font-size:11px;padding:2px 8px;border-radius:20px;font-weight:400;
}
#factorInput{
  width:100%;padding:14px;font-size:14px;
  border:2px solid var(--border);border-radius:8px;
  resize:vertical;min-height:110px;
  font-family:'Noto Sans SC',Verdana,Arial,sans-serif;
  line-height:1.6;transition:border-color .15s;
  background:#fff;
}
#factorInput:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,94,168,.1);}
.input-tips{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;
}
.tip-tag{
  background:#fff;border:1px solid var(--border);
  border-radius:20px;padding:3px 10px;
  font-size:12px;color:var(--muted);cursor:pointer;
  transition:all .15s;
}
.tip-tag:hover{border-color:var(--primary);color:var(--primary);}

/* ─── RESULTS ─────────────────────────────────────────── */
#results{margin-top:8px;}
.result-summary{
  background:linear-gradient(135deg,var(--rich-purple),var(--vibrant-blue));
  color:#fff;border-radius:var(--radius);
  padding:16px 20px;margin-bottom:16px;
  display:flex;flex-wrap:wrap;gap:16px;align-items:center;
}
.summary-stat{text-align:center;}
.summary-stat .num{font-size:28px;font-weight:700;line-height:1;}
.summary-stat .lbl{font-size:11px;opacity:.8;margin-top:2px;}
.summary-divider{width:1px;height:40px;background:rgba(255,255,255,.25);}
.summary-text{flex:1;font-size:13px;line-height:1.6;opacity:.95;}

.kit-card{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 20px;
  margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04);
  border-left:4px solid var(--vibrant-blue);
  transition:box-shadow .15s;
}
.kit-card:hover{box-shadow:var(--shadow);}
.kit-card.primary-card{border-left-color:var(--rich-purple);}
.kit-header{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin-bottom:10px;}
.kit-name{font-weight:700;font-size:15px;color:var(--text);flex:1;line-height:1.4;}
.kit-sku{
  background:var(--surface);border:1px solid var(--border);
  border-radius:6px;padding:3px 10px;font-size:12px;
  font-family:monospace;color:var(--vibrant-blue);font-weight:600;white-space:nowrap;
}
.kit-species-badge{
  background:var(--rich-purple);color:#fff;
  border-radius:20px;padding:3px 10px;font-size:11px;white-space:nowrap;
}
.annotation-badge{
  background:var(--sensitive-amber);color:#6b4c00;
  border-radius:20px;padding:3px 10px;font-size:11px;white-space:nowrap;
}
.kit-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.meta-item{font-size:12px;color:var(--muted);}
.meta-item strong{color:var(--text);}

.factors-section{margin-top:10px;}
.factors-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.factor-tags{display:flex;flex-wrap:wrap;gap:5px;}
.factor-tag{
  border-radius:4px;padding:2px 7px;font-size:12px;
  background:#e8f1fb;color:var(--vibrant-blue);
  border:1px solid rgba(26,94,168,.15);
}
.factor-tag.matched{
  background:rgba(0,155,85,.12);color:var(--vibrant-emerald);
  border-color:rgba(0,155,85,.25);font-weight:600;
}
.factor-tag.unmatched{
  background:#fff5f5;color:var(--vibrant-red);
  border-color:rgba(226,0,26,.15);
}

.uncovered-section{
  background:#fff5f5;border:1px solid rgba(226,0,26,.2);
  border-radius:var(--radius);padding:14px 18px;margin-top:12px;
}
.uncovered-title{font-size:13px;font-weight:700;color:var(--vibrant-red);margin-bottom:8px;}

.no-results{
  text-align:center;padding:40px 20px;color:var(--muted);
}
.no-results .no-icon{font-size:40px;margin-bottom:10px;}

.status-bar{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--muted);margin-bottom:14px;
  padding:10px 14px;background:var(--surface);
  border-radius:8px;border:1px solid var(--border);
}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--vibrant-teal);flex-shrink:0;
  animation:pulse 1.5s ease infinite;
}
.status-dot.idle{background:var(--border);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── BACK BTN ────────────────────────────────────────── */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;color:var(--primary);cursor:pointer;
  margin-bottom:18px;padding:6px 0;
  background:none;border:none;font-family:inherit;
}
.back-btn:hover{text-decoration:underline;}

/* ─── FOOTER ──────────────────────────────────────────── */
.footer{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(26,30,46,.96);color:rgba(255,255,255,.7);
  font-size:11px;text-align:center;padding:9px 20px;
  backdrop-filter:blur(8px);z-index:300;line-height:1.5;
}

/* ─── RESPONSIVE ──────────────────────────────────────── */
@media(max-width:600px){
  .container{padding:16px 14px;}
  .species-grid{grid-template-columns:repeat(3,1fr);gap:8px;}
  .species-card{padding:12px 8px;font-size:13px;}
  .species-card .icon{font-size:20px;margin-bottom:4px;}
  .type-grid{grid-template-columns:1fr;max-width:100%;}
  .header-title{font-size:14px;}
  .result-summary{padding:12px 14px;}
  .summary-stat .num{font-size:22px;}
}
</style>
</head>

</header>

<!-- BREADCRUMB -->
<nav class="breadcrumb" id="breadcrumb" aria-label="当前步骤">
  <span class="breadcrumb-current">① 选择种属</span>
</nav>

<!-- MAIN -->
<main class="container">

  <!-- PAGE 1: SPECIES -->
  <div class="page active" id="page-species">
    <div class="page-title">选择研究种属</div>
    <div class="page-hint">点击种属后自动进入下一步，无需确认按钮</div>
    <div class="species-grid" id="speciesGrid"></div>
  </div>

  <!-- PAGE 2: TYPE (Human only) -->
  <div class="page" id="page-type">
    <button class="back-btn" onclick="goBack('species')">← 返回种属选择</button>
    <div class="page-title">选择试剂盒类型</div>
    <div class="page-hint">人源 Milliplex 试剂盒分为筛查型与验证型，请选择：</div>
    <div class="type-grid">
      <div class="type-card" onclick="selectType('screening')">
        <span class="type-icon">🔬</span>
        <div class="type-name">筛查型</div>
        <div class="type-desc">PLEXpedition 大 Panel<br/>广谱因子覆盖，用于初步探索</div>
      </div>
      <div class="type-card" onclick="selectType('validation')">
        <span class="type-icon">✅</span>
        <div class="type-name">验证型</div>
        <div class="type-desc">精确 Panel 组合<br/>针对特定通路/疾病方向</div>
      </div>
    </div>
  </div>

// ═══════════════════════════════════════════════════════════════
// ALIAS RESOLUTION
// ═══════════════════════════════════════════════════════════════
const aliasMap = MILLIPLEX_DB.aliases || {};

function resolveAllAliases(name) {
  // Returns a set of all known names for a given factor
  const lower = name.toLowerCase().trim();
  const results = new Set([lower]);
  // Direct lookup
  for (const [key, vals] of Object.entries(aliasMap)) {
    if (key.toLowerCase() === lower) {
      vals.forEach(v => results.add(v.toLowerCase()));
    }
    if (vals.some(v => v.toLowerCase() === lower)) {
      results.add(key.toLowerCase());
      vals.forEach(v => results.add(v.toLowerCase()));
    }
  }
  // Split by slash for inline aliases e.g. "Fractalkine/CX3CL1"
  if (name.includes('/')) {
    name.split('/').forEach(p => {
      const pt = p.trim().toLowerCase();
      if (pt) results.add(pt);
    });
  }
  return results;
}

function buildFactorIndex(box) {
  // Build a set of all lowercase aliases for every factor in this kit
  const idx = new Set();
  (box.factors || []).forEach(f => {
    resolveAllAliases(f).forEach(a => idx.add(a));
    // Also add the slash-separated parts
    if (f.includes('/')) {
      f.split('/').forEach(p => idx.add(p.trim().toLowerCase()));
    }
    idx.add(f.toLowerCase().trim());
  });
  return idx;
}

// Pre-build factor indexes for all kits
const factorIndexes = MILLIPLEX_DB.datasets.map(box => buildFactorIndex(box));

// ═══════════════════════════════════════════════════════════════
// MATCHING INPUT FACTOR -> KIT FACTOR
// ═══════════════════════════════════════════════════════════════
function matchFactor(inputF, kitIndex) {
  const aliases = resolveAllAliases(inputF);
  for (const alias of aliases) {
    if (kitIndex.has(alias)) return true;
    // substring match for things like "IL-12 (p70)" vs "IL-12(p70)"
    for (const ki of kitIndex) {
      if (ki.replace(/[\s\(\)]/g,'') === alias.replace(/[\s\(\)]/g,'')) return true;
      if (ki.includes(alias) || alias.includes(ki)) {
        // Only allow substring match if length is meaningful
        if (alias.length > 4 && ki.length > 4) return true;
      }
    }
  }
  return false;
}

function matchedFactorsForKit(inputFactors, kitIdx) {
  return inputFactors.filter(f => matchFactor(f, kitIdx));
}

// ═══════════════════════════════════════════════════════════════
// OPTIMAL KIT SELECTION (greedy set cover, min kits first)
// ═══════════════════════════════════════════════════════════════
function findOptimalKits(inputFactors, kits) {
  if (!inputFactors.length) return { bestKits:[], coveredFactors:[], uncoveredFactors:[] };
  
  const targetSet = new Set(inputFactors.map(f => f.toLowerCase()));
  
  // Pre-compute coverage for each kit
  const kitCoverage = kits.map((box, i) => {
    const covered = matchedFactorsForKit(inputFactors, factorIndexes[MILLIPLEX_DB.datasets.indexOf(box)]);
    return { box, covered, count: covered.length };
  }).filter(k => k.count > 0)
    .sort((a,b) => b.count - a.count);

  if (!kitCoverage.length) {
    return { bestKits:[], coveredFactors:[], uncoveredFactors:[...inputFactors] };
  }

  // Try single kit full coverage
  const fullSingle = kitCoverage.find(k => k.count >= inputFactors.length);
  if (fullSingle) {
    return {
      bestKits: [{ box: fullSingle.box, matched: fullSingle.covered }],
      coveredFactors: fullSingle.covered,
      uncoveredFactors: inputFactors.filter(f => !fullSingle.covered.map(x=>x.toLowerCase()).includes(f.toLowerCase())),
      note: '1个试剂盒可完整覆盖全部因子 ✓'
    };
  }

  // Try 2-kit combinations (top candidates only, max 15 to keep fast)
  const topN = kitCoverage.slice(0, 15);
  let bestTwo = null;
  let bestTwoCoverage = 0;

  for (let i = 0; i < topN.length; i++) {
    for (let j = i+1; j < topN.length; j++) {
      const a = topN[i], b = topN[j];
      const combined = new Set([...a.covered.map(x=>x.toLowerCase()), ...b.covered.map(x=>x.toLowerCase())]);
      const cnt = inputFactors.filter(f => combined.has(f.toLowerCase())).length;
      if (cnt > bestTwoCoverage) {
        bestTwoCoverage = cnt;
        bestTwo = [a, b];
      }
    }
  }

  if (bestTwo) {
    const a = bestTwo[0], b = bestTwo[1];
    const combinedCovered = inputFactors.filter(f => {
      const fl = f.toLowerCase();
      return a.covered.map(x=>x.toLowerCase()).includes(fl) || b.covered.map(x=>x.toLowerCase()).includes(fl);
    });
    return {
      bestKits: [
        { box: a.box, matched: a.covered },
        { box: b.box, matched: b.covered }
      ],
      coveredFactors: combinedCovered,
      uncoveredFactors: inputFactors.filter(f => !combinedCovered.map(x=>x.toLowerCase()).includes(f.toLowerCase())),
      note: bestTwoCoverage >= inputFactors.length
        ? `2个试剂盒可完整覆盖全部${inputFactors.length}个因子 ✓`
        : `2个试剂盒最优组合，覆盖${bestTwoCoverage}/${inputFactors.length}个因子`
    };
  }

  // Fallback: single best
  const best = kitCoverage[0];
  return {
    bestKits: [{ box: best.box, matched: best.covered }],
    coveredFactors: best.covered,
    uncoveredFactors: inputFactors.filter(f => !best.covered.map(x=>x.toLowerCase()).includes(f.toLowerCase())),
    note: `最优单盒覆盖${best.count}/${inputFactors.length}个因子`
  };
}

// ═══════════════════════════════════════════════════════════════
// PARSE INPUT
// ═══════════════════════════════════════════════════════════════
function parseFactors(text) {
  if (!text || !text.trim()) return [];
  const parts = text
    .split(/[
,，;；	]/)
    .flatMap(p => p.split(/\s{2,}/))
    .map(p => p.trim())
    .filter(p => p.length > 1);
  return [...new Set(parts)];
}

function renderSpecies() {
  const grid = document.getElementById('speciesGrid');
  grid.innerHTML = '';
  SPECIES_LIST.forEach(sp => {
    const card = document.createElement('div');
    card.className = 'species-card';
    card.innerHTML = `<span class="icon">${sp.icon}</span><span class="label">${sp.zh}</span>`;
    card.onclick = () => selectSpecies(sp);
    grid.appendChild(card);
  });
}

function selectSpecies(sp) {
  state.species = sp.en;
  state.speciesZh = sp.zh;
  state.type = null;
  if (sp.hasType) {
    showPage('type');
    updateBreadcrumb([sp.zh]);
  } else {
    state.type = 'all';
    goToFactors();
  }
}

function selectType(type) {
  state.type = type;
  goToFactors();
}

function goToFactors() {
  const sp = SPECIES_LIST.find(s => s.en === state.species);
  const typeLabel = state.type === 'screening' ? '筛查型' : state.type === 'validation' ? '验证型' : '';
  updateBreadcrumb([state.speciesZh, typeLabel].filter(Boolean));
  document.getElementById('factorPageTitle').textContent =
    `输入检测因子 — ${state.speciesZh}${typeLabel ? ' · ' + typeLabel : ''}`;
  
  // Set example tips
  const examples = EXAMPLE_FACTORS[state.species] || EXAMPLE_FACTORS.default;
  const tips = document.getElementById('exampleTips');
  tips.innerHTML = '<span style="font-size:12px;color:var(--muted);margin-right:4px;">示例因子：</span>' +
    examples.map(e => `<span class="tip-tag" onclick="addExample('${e}')">${e}</span>`).join('');
  
  document.getElementById('factorInput').value = '';
  document.getElementById('results').innerHTML = '';
  setStatus('idle','等待输入因子…');
  showPage('factors');
  setTimeout(() => document.getElementById('factorInput').focus(), 100);
}

function addExample(factor) {
  const ta = document.getElementById('factorInput');
  const val = ta.value.trim();
  ta.value = val ? val + '
' + factor : factor;
  ta.dispatchEvent(new Event('input'));
}

function backFromFactors() {
  const sp = SPECIES_LIST.find(s => s.en === state.species);
  if (sp && sp.hasType) {
    showPage('type');
    updateBreadcrumb([state.speciesZh]);
  } else {
    goBack('species');
  }
}

function goBack(target) {
  state.species = null; state.speciesZh = null; state.type = null;
  showPage('species');
  updateBreadcrumb([]);
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
}

function updateBreadcrumb(steps) {
  const bc = document.getElementById('breadcrumb');
  const allSteps = ['选择种属', ...steps, steps.length ? '因子输入' : ''].filter(Boolean);
  bc.innerHTML = allSteps.map((s, i) => {
    if (i === allSteps.length - 1) return `<span class="breadcrumb-current">${'①②③'.charAt(i) || (i+1) + '.'} ${s}</span>`;
    return `<span class="breadcrumb-item" onclick="goBack('species')">${'①②③'.charAt(i) || (i+1) + '.'} ${s}</span><span class="breadcrumb-sep">›</span>`;
  }).join('');
}

function performSearch(inputFactors) {
  const resultsEl = document.getElementById('results');
  
  if (!inputFactors.length) {
    resultsEl.innerHTML = '';
    setStatus('idle','等待输入因子…');
    return;
  }
  
  setStatus('active','正在检索最优匹配…');
  
  // Filter kits by species + type
  let pool = MILLIPLEX_DB.datasets.filter(d => {
    if (state.species === 'Multi-Species') return d.species === 'Multi-Species';
    if (state.species === 'all') return true;
    if (!d.species) return false;
    if (d.species !== state.species) return false;
    if (state.type === 'all' || !state.type) return true;
    if (state.type === 'screening') return d.type === 'screening';
    if (state.type === 'validation') return d.type === 'validation' || d.type !== 'screening';
    return true;
  });
  
  const result = findOptimalKits(inputFactors, pool);
  setStatus('idle', result.note || `检索完成`);
  
  if (!result.bestKits.length) {
    resultsEl.innerHTML = `
      <div class="no-results">
        <div class="no-icon">🔍</div>
        <div>在当前种属条件下未找到匹配的试剂盒</div>
        <div style="font-size:12px;margin-top:6px;color:var(--muted)">请检查因子名称拼写，或尝试使用因子别名</div>
      </div>`;
    return;
  }
  
  const covered = result.coveredFactors.length;
  const total = inputFactors.length;
  const uncovered = result.uncoveredFactors;
  const kitCount = result.bestKits.length;
  
  let html = `
  <div class="result-summary">
    <div class="summary-stat">
      <div class="num">${kitCount}</div>
      <div class="lbl">推荐试剂盒</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="num">${covered}/${total}</div>
      <div class="lbl">因子覆盖</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="num">${uncovered.length}</div>
      <div class="lbl">未覆盖因子</div>
    </div>
    <div class="summary-text">${result.note || ''}</div>
  </div>`;
  
  result.bestKits.forEach((item, idx) => {
    const box = item.box;
    const matched = item.matched.map(f => f.toLowerCase());
    const annotation = box.annotation && box.annotation.trim();
    
    html += `
    <div class="kit-card${idx === 0 ? ' primary-card' : ''}">
      <div class="kit-header">
        <div class="kit-name">${box.name}</div>
        <div class="kit-sku">${box.sku}</div>
        <span class="kit-species-badge">${box.species_zh || box.species}</span>
        ${annotation ? `<span class="annotation-badge">⚠ ${annotation}</span>` : ''}
      </div>
      <div class="factors-section">
        <div class="factors-title">覆盖因子（匹配高亮）</div>
        <div class="factor-tags">
          ${(box.factors || []).map(f => {
            const isMatch = matched.includes(f.toLowerCase());
            return `<span class="factor-tag${isMatch ? ' matched' : ''}">${f}</span>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  });
  
  if (uncovered.length) {
    html += `
    <div class="uncovered-section">
      <div class="uncovered-title">⚠ 未被覆盖的因子（${uncovered.length} 个）</div>
      <div class="factor-tags">
        ${uncovered.map(f => `<span class="factor-tag unmatched">${f}</span>`).join('')}
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:10px;">
        以上因子在当前种属的 Milliplex 数据库中暂无匹配，建议核查因子名称或别名。
      </div>
    </div>`;
  }
  
  resultsEl.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════
document.getElementById('factorInput').addEventListener('input', function() {
  const val = this.value;
  if (state.debounceTimer) clearTimeout(state.debounceTimer);
  if (!val.trim()) {
    document.getElementById('results').innerHTML = '';
    setStatus('idle','等待输入因子…');
    return;
  }
  setStatus('active','正在解析…');
  state.debounceTimer = setTimeout(() => {
    state.factors = parseFactors(val);
    performSearch(state.factors);
  }, 320);
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
renderSpecies();
</script>
